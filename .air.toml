root = "."
tmp_dir = "tmp"

[build]
  cmd = "swag init -g ./cmd/api/main.go && go build -o ./tmp/main ./cmd/api"
  include_ext = ["go", "tpl", "tmpl", "html", "js", "css", "scss", "sass", "json", "yaml", "yml"]
  exclude_dir = ["assets", "tmp", "vendor", "docs"]
  delay = 1000

[log]
  time = true

[run]
  cmd = "./tmp/main"
